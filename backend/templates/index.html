<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ServiceNow Portal - SAP BTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h2 class="mb-4">ServiceNow Provisioning Portal</h2>
    
    <ul class="nav nav-pills mb-3" id="pills-tab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#single-pane">Single Ticket</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#bulk-pane">Bulk Upload</button></li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active card p-4 shadow-sm" id="single-pane">
            <form id="singleForm">
                <input type="hidden" name="mode" value="single">
                <div class="mb-3">
                    <label class="form-label">Short Description *</label>
                    <input type="text" name="short_description" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Ticket</button>
            </form>
        </div>

        <div class="tab-pane fade card p-4 shadow-sm" id="bulk-pane">
            <form id="bulkForm" enctype="multipart/form-data">
                <input type="hidden" name="mode" value="bulk">
                <div class="mb-3">
                    <label class="form-label">Upload File (.json, .xlsx, .xml)</label>
                    <input type="file" name="file" class="form-control" accept=".json,.xlsx,.xls,.xml" required>
                </div>
                <button type="submit" class="btn btn-success">Upload Batch</button>
            </form>
        </div>
    </div>

    <div id="alertBox" class="mt-4"></div>
    <div id="resultsTable" class="mt-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function handleSubmit(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const resultsTable = document.getElementById('resultsTable');
    alertBox.innerHTML = '<div class="alert alert-info">Processing request...</div>';
    resultsTable.innerHTML = '';

    const formData = new FormData(e.target);
    try {
        const response = await fetch('/api/tickets', { method: 'POST', body: formData });
        const data = await response.json();

        if (!response.ok) {
            let errorHtml = '<div class="alert alert-danger"><strong>Error:</strong><ul>';
            (data.errors || [data.message]).forEach(err => errorHtml += `<li>${err}</li>`);
            errorHtml += '</ul></div>';
            alertBox.innerHTML = errorHtml;
            return;
        }

        alertBox.innerHTML = `<div class="alert alert-success">Processed ${data.total} item(s).</div>`;
        let tableHtml = `<table class="table table-bordered bg-white"><thead><tr><th>#</th><th>Status</th><th>Ticket Number</th><th>Sys ID / Details</th></tr></thead><tbody>`;
        data.results.forEach(r => {
            tableHtml += `<tr class="${r.status === 'SUCCESS' ? 'table-success' : 'table-danger'}">
                <td>${r.row}</td><td>${r.status}</td><td>${r.ticket_number || 'N/A'}</td><td>${r.sys_id || r.error}</td>
            </tr>`;
        });
        tableHtml += '</tbody></table>';
        resultsTable.innerHTML = tableHtml;
    } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger">Execution error: ${err.message}</div>`;
    }
}
document.getElementById('singleForm').addEventListener('submit', handleSubmit);
document.getElementById('bulkForm').addEventListener('submit', handleSubmit);
</script>
</body>
</html>
