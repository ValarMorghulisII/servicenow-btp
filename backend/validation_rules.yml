rules:
  title:
    mandatory: true
    min_length: 3
    max_length: 100
    aliases: ["short_description", "name", "summary"]

  severity:
    mandatory: true
    allowed_values: ["1", "2", "3", "4", "5", "Low", "Medium", "High", "Critical"]

  priority:
    mandatory: false
    allowed_values: ["1", "2", "3", "4", "5", "Low", "Medium", "High", "Critical"]

  description:
    mandatory: false
    max_length: 2000

  cvss_score:
    mandatory: false
    regex_pattern: "^(10(\\.0)?|[0-9](\\.\\d)?)$"

  lob:
    mandatory: false
    max_length: 50
    aliases: ["line_of_business"]

  reportee:
    mandatory: false
    max_length: 100
    aliases: ["reporter", "assigned_to", "owner"]