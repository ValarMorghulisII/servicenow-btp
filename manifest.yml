---
applications:
  # Approuter Module
  - name: servicenow-approuter
    path: approuter
    memory: 128M
    buildpacks:
      - nodejs_buildpack
    env:
      destinations: >
        [
          {
            "name": "backend-api",
            "url": "https://servicenow-backend.cfapps.<region>.hana.ondemand.com",
            "forwardAuthToken": true
          }
        ]

  # Python Dockerized Backend
  - name: servicenow-backend
    path: backend
    docker:
      image: <your-docker-registry>/servicenow-backend:latest
    memory: 512M
    env:
      SN_INSTANCE: "your-instance.service-now.com"
      SN_USER: "api_user"
      SN_PASSWORD: "api_password"