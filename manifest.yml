---
applications:
  # Approuter Module (SSO via XSUAA)
  - name: servicenow-approuter
    path: approuter
    memory: 128M
    buildpacks:
      - nodejs_buildpack
    env:
      destinations: >
        [
          {
            "name": "backend-api",
            "url": "https://servicenow-backend.cfapps.<region>.hana.ondemand.com",
            "forwardAuthToken": true
          }
        ]
    services:
      - servicenow-xsuaa

  # Python Web API Container
  - name: servicenow-backend
    path: backend
    docker:
      image: <your-docker-registry>/servicenow-backend:latest
    memory: 512M
    env:
      SN_INSTANCE: "your-instance.service-now.com"
      VAULT_URL: "https://vault.yourdomain.com/v1/secret/data/servicenow"
      VAULT_TOKEN: "your-vault-token"
      REDIS_URL: "redis://servicenow-redis:6379/0"
    services:
      - servicenow-xsuaa
      - servicenow-redis

  # Python Celery Worker Container
  - name: servicenow-worker
    path: backend
    docker:
      image: <your-docker-registry>/servicenow-backend:latest
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    memory: 512M
    no-route: true
    health-check-type: process
    env:
      SN_INSTANCE: "your-instance.service-now.com"
      VAULT_URL: "https://vault.yourdomain.com/v1/secret/data/servicenow"
      VAULT_TOKEN: "your-vault-token"
      REDIS_URL: "redis://servicenow-redis:6379/0"
    services:
      - servicenow-xsuaa
      - servicenow-redis